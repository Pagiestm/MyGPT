name: mygpt-prod

services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME est requis}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD est requis}
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE est requis}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  db-backup:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD est requis}
    volumes:
      - db-backups:/backups
    entrypoint: ['sh', '-c']
    command:
      - |
        while true; do
          nom="/backups/mygpt-$$(date +%Y%m%d-%H%M%S).dump"
          if pg_dump -h db -U "${DB_USERNAME}" -d "${DB_DATABASE}" -Fc -f "$$nom"; then
            echo "sauvegarde $$nom ($$(du -h "$$nom" | cut -f1))"
            find /backups -name 'mygpt-*.dump' -mtime +${BACKUP_KEEP_DAYS:-7} -delete
          else
            echo "echec de la sauvegarde" >&2
            rm -f "$$nom"
          fi
          sleep ${BACKUP_INTERVAL:-86400}
        done
    depends_on:
      db:
        condition: service_healthy

  server:
    build:
      context: .
      dockerfile: server/Dockerfile.prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME est requis}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD est requis}
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE est requis}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET est requis (32 caractères minimum)}
      CLIENT_URL: ${CLIENT_URL:?CLIENT_URL est requis, par exemple https://mygpt.example.fr}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    expose:
      - '3000'
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: client/Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:?VITE_API_URL est requis, par exemple https://api.mygpt.example.fr}
    restart: unless-stopped
    expose:
      - '80'
    depends_on:
      - server

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN est requis, par exemple mygpt.example.fr}
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN est requis, par exemple api.mygpt.example.fr}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL est requis pour les certificats Let's Encrypt}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    depends_on:
      - client
      - server

volumes:
  db-data:
  db-backups:
  caddy-data:
  caddy-config:
