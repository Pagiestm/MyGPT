services:
  - name: mygpt-api
    type: web
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./server/Dockerfile.prod
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - server/**
        - package.json
        - package-lock.json
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://mygpt-t4z9.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://mygpt-t4z9.onrender.com/api/auth/google/callback
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_SECURE
        value: 'false'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false

  - name: mygpt
    type: web
    runtime: static
    buildCommand: npm ci && npm run build -w client
    staticPublishPath: ./client/dist
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - client/**
        - package.json
        - package-lock.json
    envVars:
      - key: VITE_API_URL
        value: /api
    routes:
      - type: rewrite
        source: /api/*
        destination: https://mygpt-api.onrender.com/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
